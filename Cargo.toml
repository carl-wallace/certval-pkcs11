[package]
name = "certval-pkcs11"
version = "0.1.0"
description = """
PKCS #11 crypto provider for certval. Offloads message digest calculation and certificate signature
verification to a PKCS #11 module, so certification path validation can be performed using the
cryptographic implementation a deployment is required to use.
"""
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-pkcs11"
categories = ["cryptography"]
keywords = ["pkcs11", "x509", "certval", "hsm"]
readme = "README.md"
edition = "2021"
rust-version = "1.88"

[features]
default = []
# Enables certval's software ML-DSA implementation. The provider itself needs nothing from it - it
# maps ML-DSA algorithm identifiers onto PKCS #11 mechanisms without performing any post-quantum
# arithmetic - but the ML-DSA corpus test has nothing to compare a module against without it. It is
# off by default because the provider has no use for a software ML-DSA implementation.
pqc = ["certval/pqc"]

[dependencies]
certval = { version = "0.2.0-rc.1", default-features = false, features = ["std", "rsa"] }

cryptoki = "0.12.0"

const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.1", features = ["alloc", "derive", "oid"] }
spki = "0.8.0"

log = "0.4.33"
sha2 = "0.11.0"

[dev-dependencies]
x509-cert = { version = "0.3.0", features = ["hazmat"] }
env_logger = "0.11.11"

# Uncomment while developing certval and this crate together: it redirects the crates.io dependency
# above to the local checkout, so edits take effect without a publish. Leave it commented on anything
# that is committed, or the build depends on a path that only exists here.
# [patch.crates-io]
# certval = { path = "../rust-pki/certval" }
