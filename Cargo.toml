[package]
name = "certval-pkcs11"
version = "0.1.0-rc.1"
description = """
PKCS #11 crypto provider for certval. Offloads message digest calculation and certificate signature
verification to a PKCS #11 module, so certification path validation can be performed using the
cryptographic implementation a deployment is required to use.
"""
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-pkcs11"
categories = ["cryptography"]
keywords = ["pkcs11", "x509", "certval", "hsm"]
readme = "README.md"
edition = "2021"
rust-version = "1.89"
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
default = []
# Enables certval's software ML-DSA implementation. The provider itself needs nothing from it - it
# maps ML-DSA algorithm identifiers onto PKCS #11 mechanisms without performing any post-quantum
# arithmetic - but the ML-DSA corpus test has nothing to compare a module against without it. It is
# off by default because the provider has no use for a software ML-DSA implementation.
pqc = ["certval/pqc", "certval-cms?/pqc"]
# Implements certval-cms's recipient and signing credentials over private keys a token holds, and a
# source that finds them among the token's certificates.
cms = ["dep:certval-cms", "dep:cms", "dep:x509-cert", "dep:zeroize"]

[dependencies]
certval = { version = "0.2.0-rc.2", default-features = false }

cryptoki = "0.12.0"

const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.3", features = ["alloc", "derive", "oid"] }
spki = "0.8.0"

log = "0.4.33"
sha2 = "0.11.0"

certval-cms = { version = "0.1.0-rc.1", optional = true }
cms = { version = "0.3.0-rc.0", optional = true }
x509-cert = { version = "0.3.0", default-features = false, optional = true }
zeroize = { version = "1.8.1", optional = true }

[dev-dependencies]
# certval's software RSA, which the tests compare this provider's verdicts against. A dev-dependency,
# so the application, not this crate, decides which algorithms certval's software offers.
certval = { version = "0.2.0-rc.2", default-features = false, features = ["rsa"] }
x509-cert = { version = "0.3.0", features = ["builder", "hazmat"] }
env_logger = "0.11.11"
# The cms tests: certificates for keys generated on the token, issued by a CA whose key is in
# software, and the random number generator certval-cms's builders take.
cms = "0.3.0-rc.0"
getrandom = { version = "0.4.1", features = ["sys_rng"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
rand_core = "0.10.1"
sha1 = "0.11.0"

[package.metadata.docs.rs]
features = ["cms", "pqc"]
rustdoc-args = ["--cfg", "docsrs"]

[patch.crates-io]
# certval-cms is not on crates.io yet, so the `cms` feature takes it from the neighboring checkout.
# Remove this once it publishes.
certval-cms = { path = "../certval-cms" }

# Uncomment while developing certval and this crate together: it redirects the crates.io dependency
# above to the local checkout, so edits take effect without a publish. Leave it commented on anything
# that is committed, or the build depends on a path that only exists here.
# certval = { path = "../rust-pki/certval" }
